[build-system]
requires = ["setuptools>=80", "packaging>=24.2", "numpy>=2.0", "cython>=3.1", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "insightface"
version = "0.7.3"
dependencies = [
    "numpy>=1.23",
    "onnx",
    "tqdm",
    "requests",
    "matplotlib",
    "Pillow",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "easydict",
    "albumentations",
    "prettytable",
]
authors = [
    { name = "InsightFace Contributors", email = "contact@insightface.ai" },
    { name = "AppMana", email = "accounts@appmana.com" },
]
description = "InsightFace Python Library (stable-ABI fork)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest", "onnxruntime"]

[project.urls]
Homepage = "https://github.com/AppMana/forks-insightface-stable-abi"
Upstream = "https://github.com/deepinsight/insightface"
Issues = "https://github.com/AppMana/forks-insightface-stable-abi/issues"

[project.entry-points."console_scripts"]
insightface-cli = "insightface.commands.insightface_cli:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["docs*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = []

[tool.cibuildwheel]
build = "cp311-*"
build-frontend = "build"
# Smoke-test only inside cibuildwheel: import + extension call. The full
# pytest suite (which needs onnxruntime/scipy) runs separately on
# native-x86_64 hosts in CI, not inside the per-arch matrix.
test-command = """python -c \"import insightface; from insightface.thirdparty.face3d.mesh.cython import mesh_core_cython; assert '.abi3.' in mesh_core_cython.__file__; import numpy as np; mesh_core_cython.get_normal_core(np.zeros((3,3),dtype=np.float32), np.zeros((1,3),dtype=np.float32), np.zeros((1,3),dtype=np.int32), 1); print('insightface', insightface.__version__, 'OK')\""""
skip = ["*-win32", "*-manylinux_i686", "pp*", "*-musllinux_*"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
