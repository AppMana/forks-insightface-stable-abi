[build-system]
requires = ["setuptools>=80", "packaging>=24.2", "numpy>=2.0", "cython>=3.1", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "insightface"
version = "0.7.3"
dependencies = [
    "numpy>=1.23",
    "onnx",
    "tqdm",
    "requests",
    "matplotlib",
    "Pillow",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "easydict",
    "albumentations",
    "prettytable",
]
authors = [
    { name = "InsightFace Contributors", email = "contact@insightface.ai" },
    { name = "AppMana", email = "accounts@appmana.com" },
]
description = "InsightFace Python Library (stable-ABI fork)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest", "onnxruntime"]

[project.urls]
Homepage = "https://github.com/AppMana/forks-insightface-stable-abi"
Upstream = "https://github.com/deepinsight/insightface"
Issues = "https://github.com/AppMana/forks-insightface-stable-abi/issues"

[project.entry-points."console_scripts"]
insightface-cli = "insightface.commands.insightface_cli:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["docs*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = []

[tool.cibuildwheel]
# cp311 build emits the long-lived cp311-abi3 wheel covering 3.11+.
# cp310 build emits a per-version cp310-cp310 wheel for users still on 3.10
# (3.10 hits EOL October 2026; this entry can be dropped after that).
build = ["cp310-*", "cp311-*"]
build-frontend = "build"
# insightface/__init__.py hard-imports onnxruntime, so even reaching the
# extension module needs it installed. Pinning the test deps keeps the
# smoke fast and avoids pulling in the full scipy/scikit-image stack.
test-requires = ["numpy>=2.0", "onnxruntime"]
test-command = """python -c \"from insightface.thirdparty.face3d.mesh.cython import mesh_core_cython; import numpy as np; mesh_core_cython.get_normal_core(np.zeros((3,3),dtype=np.float32), np.zeros((1,3),dtype=np.float32), np.zeros((1,3),dtype=np.int32), 1); print('OK', mesh_core_cython.__file__)\""""
skip = ["*-win32", "*-manylinux_i686", "pp*", "*-musllinux_*"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
